name: Console checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  recovery-flow:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install the pinned Rumi checkout
        run: python -m pip install -e "./Rumi[test]"
      - name: Check imports and frontend syntax
        run: |
          python -m integration.serve --check
          node --check frontend/assets/js/console.js
          node --test integration/hosting/worker.test.mjs
      - name: Check real crash, recovery, repetition and refusals
        run: python -m integration.test_flow --keep
      - name: Check the existing recovery API
        working-directory: Rumi
        run: python -m pytest tests/test_recovery.py -q -p no:cacheprovider
